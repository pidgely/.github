name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the request you made (without your API key) and the response you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK / tool version
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: e.g. Node 24 on Ubuntu 24.04
